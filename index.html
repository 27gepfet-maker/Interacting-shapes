<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <audio id="background-music" src="the_mountain_retro_game_593063.mp3" preload="auto"></audio>
        <audio id="wind-sound" src="SoundClip.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Background Audio -->
      <a-sound src="#background-music" autoplay="true" loop="true" volume="0.5"></a-sound>

      <!-- Camera and Cursor -->
      <a-camera>
        <a-cursor></a-cursor>
      </a-camera>

      <!-- Environment Plane -->
      <a-plane position="0 0 10" sound="src: #wind-sound; on: click; volume: 1" rotation="90 0 0" width="60" height="60" color="#7BC8A4"></a-plane>

      <!-- Animated Box -->
      <a-box color="orange" position="0 1 10" depth="2" height="2" width="2"
        animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 2000; easing: linear; loop: true"
        animation__2="property: position; from: 0 1 10; to: 0 8 10; dir: alternate; dur: 1500; easing: easeInOutElastic; loop: true"
        animation__3="property: scale; from: 1 1 1; to: 0 0 0; startEvents: click">
      </a-box>

      <!-- Animated Cone -->
      <a-cone color="blue" radius-bottom="2" radius-top="0.5" height="1" position="6 6 10"
        animation="property: position; from: 6 6 10; to: 6 6 8; dir: alternate; dur: 1500; easing: easeInOutElastic; loop: true"
        animation__2="property: scale; from: 1 1 1; to: 0 0 0; startEvents: click">
      </a-cone>

      <!-- Animated Sphere -->
      <a-sphere color="crimson" radius="1" position="3 1 10"
        animation="property: position; from: 3 1 10; to: 8 5 10; dir: alternate; dur: 1900; easing: easeInOutElastic; loop: true"
        animation__2="property: scale; from: 1 1 1; to: 0 0 0; startEvents: click">
      </a-sphere>
    </a-scene>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const scene = document.querySelector('a-scene');
        const music = document.querySelector('#background-music');
        
        const startMusic = () => {
          if (music && music.components && music.components.sound) {
            music.components.sound.playSound();
          }
        };

        scene.addEventListener('mousemove', startMusic, { once: true });
        window.addEventListener('touchstart', startMusic, { once: true });
      });
    </script>
  </body>
</html>
