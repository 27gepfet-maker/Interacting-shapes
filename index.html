<!DOCTYPE html>
<html>
  <head>
    <!-- FIX 1: Linked a real, working CDN version of A-Frame -->
    <script src="https://aframe.io"></script>
    
    <script>
      AFRAME.registerComponent('interact-object', {
        init: function () {
          var el = this.el;
          
          el.addEventListener('click', function () {
            if (el.components.sound) {
              el.components.sound.playSound();
            }
            
            el.setAttribute('animation__disappear', {
              property: 'scale',
              to: '0 0 0',
              dur: 200,
              easing: 'easeInQuad'
            });
            
            setTimeout(function() {
              el.parentNode.removeChild(el);
            }, 200);
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene>
      
      <a-assets>
        <!-- FIX 4: Changed paths back to your local files so they can decode properly -->
        <audio id="bgm-asset" src="background.mp3" preload="auto"></audio>
        <audio id="click-sfx" src="sound1.mp3" preload="auto"></audio>
      </a-assets>

      
      

      <a-camera>
        <a-cursor color="black" raycaster="objects: [interact-object]"></a-cursor>
      </a-camera>

      <a-plane position="0 0 -10" rotation="-90 0 0" width="60" height="60" color="#7BC8A4"></a-plane>

      <a-box color="orange" position="0 1 -10" depth="2" height="2" width="2" 
             sound="src: #click-sfx; autoplay: false; poolSize: 5"
             interact-object
             animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 2000; easing: linear; loop: true;" 
             animation__2="property: position; from: 0 1 -10; to: 0 5 -10; dir: alternate; dur: 1500; easing: easeInOutElastic; loop: true;">
      </a-box>

      <a-cone color="blue" radius-bottom="2" radius-top="0.5" height="1" position="-6 4 -10" 
              sound="src: #click-sfx; autoplay: false; poolSize: 5"
              interact-object
              animation="property: position; from: -6 4 -10; to: -6 4 2; dir: alternate; dur: 1500; easing: easeInOutElastic; loop: true;">
      </a-cone>

      <a-sphere color="crimson" radius="1" position="-3 1 -5" 
                sound="src: #click-sfx; autoplay: false; poolSize: 5"
                interact-object
                animation="property: position; from: -3 1 -5; to: -5 3 -5; dir: alternate; dur: 1900; easing: easeInOutElastic; loop: true;">
      </a-sphere>

    </a-scene>

    
    <script>
      const startAudioContext = () => {
        const bgmEntity = document.querySelector('#bgm');
        if (bgmEntity && bgmEntity.components && bgmEntity.components.sound) {
          bgmEntity.components.sound.playSound();
        }
        window.removeEventListener('click', startAudioContext);
        window.removeEventListener('touchstart', startAudioContext);
      };

      window.addEventListener('click', startAudioContext);
      window.addEventListener('touchstart', startAudioContext);
    </script>
  </body>
</html>
