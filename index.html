<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io"></script>
    <style>
      #overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(18, 18, 18, 0.95);
        z-index: 99999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: sans-serif;
      }
      #start-btn {
        padding: 16px 32px;
        font-size: 20px;
        background: #7BC8A4;
        border: none;
        border-radius: 8px;
        color: black;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(123, 200, 164, 0.4);
        transition: transform 0.2s;
      }
      #start-btn:hover {
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>

    <div id="overlay">
      <h2>3D Audio Environment Ready</h2>
      <button id="start-btn">ENTER SCENE & START MUSIC</button>
    </div>

    <!-- Removed autonomous sound component from scene to avoid conflicts -->
    <a-scene id="scene">
      <a-camera>
        <a-cursor></a-cursor>
      </a-camera>

      <a-assets>
        <!-- Standard HTML5 Audio nodes handled by our direct browser trigger -->
        <audio id="background-music" src="the_mountain-retro-game-593063.mp3" loop preload="auto"></audio>
        <audio id="wind" src="SoundClip.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Attached a direct click handler component to the ground plane -->
      <a-plane position="0 0 -10" rotation="-90 0 0" width="60" height="60" color="#7BC8A4"
               onclick="document.getElementById('wind').play()"></a-plane>

      <a-box color="orange" position="0 1 -10" depth="2" height="2" width="2" 
             animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 2000; easing: linear; loop: true;" 
             animation__2="property: position; from: 0 1 -10; to: 0 8 -10; dir: alternate; dur: 1500; easing: easeInOutElastic; loop: true;" 
             animation__3="property: scale; from: 1 1 1; to: 0 0 0; startEvents: click;"></a-box>

      <a-cone color="blue" radius-bottom="2" radius-top="0.5" height="1" position="-6 6 -10" 
              animation="property: position; from: -6 6 -10; to: -6 6 8; dir: alternate; dur: 1500; easing: easeInOutElastic; loop: true;" 
              animation__2="property: scale; from: 1 1 1; to: 0 0 0; startEvents: click;"></a-cone>

      <a-sphere color="crimson" radius="1" position="-3 1 10" 
                animation="property: position; from: -3 1 10; to: -8 5 10; dir: alternate; dur: 1900; easing: easeInOutElastic; loop: true;" 
                animation__2="property: scale; from: 1 1 1; to: 0 0 0; startEvents: click;"></a-sphere>
    </a-scene>

    <script>
      const overlay = document.querySelector('#overlay');
      const startBtn = document.querySelector('#start-btn');
      const bgMusic = document.querySelector('#background-music');

      startBtn.addEventListener('click', () => {
        overlay.style.display = 'none';

        // FORCE WAKE: Wakes up the web browser's native audio timeline
        if (THREE.AudioContext && THREE.AudioContext.getContext) {
          const context = THREE.AudioContext.getContext();
          if (context.state === 'suspended') {
            context.resume(); // Unlocks Web Audio hardware natively
          }
        }

        // Direct HTML5 execution bypasses A-Frame loading glitches
        bgMusic.volume = 0.5;
        bgMusic.play().catch(err => {
          console.error("Audio playback stalled: ", err);
        });
      });
    </script>
  </body>
</html>
